name: Run Laravel Tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  lint:
    name: Check Code Quality (Lint)
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.4'

    - name: Install PHP Dependencies
      run: composer install -q --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist

    - name: Run Laravel Pint (Style Checker)
      run: ./vendor/bin/pint --test

  phpstan:
    name: Static Analysis (PHPStan)
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.4'

    - name: Install PHP Dependencies
      run: composer install -q --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist

    - name: Run PHPStan
      run: ./vendor/bin/phpstan analyse

  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.4'
        extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite3, pdo_sqlite
        coverage: none

    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: '24' # Vite 8 needs Node 20.19+ or 22.12+

    - name: Copy .env
      run: php -r "file_exists('.env') || copy('.env.example', '.env');"

    - name: Install PHP Dependencies
      run: composer install -q --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist

    - name: Install Node Dependencies
      run: npm ci

    - name: Build Frontend Assets
      run: npm run build

    - name: Generate Key
      run: php artisan key:generate

    - name: Run Tests (PHPUnit)
      run: php artisan test

  deploy:
    name: Deploy to Production
    needs: [lint, phpstan, test] # Waits for ALL three parallel jobs to pass!
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
    - name: Simulate SSH Deployment
      run: |
        echo "🔒 Connecting to Live VPS via SSH Secure Key..."
        sleep 2
        echo "⬇️ Downloading latest code: git pull origin main"
        sleep 2
        echo "📦 Installing live packages: composer install --no-dev"
        sleep 2
        echo "🗄️ Updating Database: php artisan migrate --force"
        sleep 2
        echo "🔄 Restarting Queue Workers: php artisan queue:restart"
        sleep 2
        echo "✅ Deployment Successful! Your code is now live for customers! 🚀"
